name: multi-repo-sync

on:
  schedule:
    - cron: "*/10 * * * *"   # jalan tiap 10 menit (UTC)
  workflow_dispatch: {}       # bisa dijalankan manual
  push:
    paths:
      - "multi_repo_sync.py"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub requests

      - name: Run multi-repo sync
        env:
          # ===== WAJIB =====
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}   # atau pakai PAT kamu sendiri: secrets.GITHUB_PAT
          # ===== SUMBER =====
          SOURCE_URL: "https://raw.githubusercontent.com/Xaffin/-/refs/heads/main/%E0%B8%AD%E0%B8%B1%E0%B8%9F%E0%B8%9F%E0%B8%B4%E0%B8%99"
          # ===== TARGET REPO MODE (pilih salah satu cara) =====
          # 1) LIST CSV PRESISI:
          REPOS_CSV: "Akara4579/Lazyakara"
          # 2) SINGLE REPO:
          # SINGLE_REPO: "Akara4579/Lazyakara"
          # 3) SEMUA REPO DALAM OWNER (HATI-HATI):
          # OWNER_ALL_REPOS: "Akara4579"

          # ===== PREFERENSI =====
          GIT_BRANCH: "main"
          COMMIT_MSG: "Auto update: Sync playlist from source + footer update (multi-repo)"
          SLEEP_BETWEEN_COMMITS_SEC: "0.7"
          SLEEP_BETWEEN_REPOS_SEC: "1.0"

          # ===== EXPIRE RULE =====
          EXPIRE_HOUR_LOCAL: "13"
          EXPIRE_MINUTE_LOCAL: "0"
          HONOR_MARKER_EVEN_BEFORE_EXPIRY: "false"  # true = paksa expired jika ada .SYNC_DISABLED

          # ===== TARGET FILES =====
          MONTH_NAME: ""
          YEAR: ""
          PREFIX: ""
        run: |
          python multi_repo_sync.py
