name: lazyakara-auto-sync

on:
  schedule:
    - cron: "*/10 * * * *"   # jalan tiap 10 menit (UTC)
  workflow_dispatch:
  push:
    paths:
      - "auto_sync_lazyakara.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub requests

      - name: Jalankan auto sync
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python auto_sync_lazyakara.py
